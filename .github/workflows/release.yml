name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs & Bundle (ARM & Universal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Split-per-ABI APKs (ARM64, ARMv7, x86_64)
        run: flutter build apk --split-per-abi --release

      - name: Build Universal FAT APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Organize Output Binaries
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-artifacts/Fixora-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-artifacts/Fixora-${TAG}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release-artifacts/Fixora-${TAG}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/Fixora-${TAG}-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release-artifacts/Fixora-${TAG}.aab"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-artifacts/Fixora-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-artifacts/Fixora-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release-artifacts/Fixora-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/Fixora-universal.apk"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: release-artifacts/*

  build-web:
    name: Build Web Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Package Web Build
        run: |
          TAG="${{ github.ref_name }}"
          cd build/web && zip -r "../../Fixora-web-${TAG}.zip" .
          cd ../.. && cp "Fixora-web-${TAG}.zip" Fixora-web.zip

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            Fixora-web-*.zip
            Fixora-web.zip

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-android, build-web]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: ./artifacts

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Fixora Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/*
          body: |
            # 🚀 Fixora Production Release (${{ github.ref_name }})

            ### 📱 Android Application Packages (APK & AAB)
            - **ARM 64-bit (`arm64-v8a`)**: Recommended for all modern Android phones (Snapdragon, MediaTek, Exynos, Tensor).
            - **ARM 32-bit (`armeabi-v7a`)**: Optimized for budget and legacy 32-bit devices.
            - **Universal (All ABIs)**: Universal package with full hardware compatibility.
            - **x86_64**: For emulators, ChromeOS, and x86 devices.
            - **Android App Bundle (AAB)**: Production bundle for Google Play Store.

            ### 🌐 Interactive Web Preview
            - Live preview available at: **[https://prakhyat05.github.io/Fixora/](https://prakhyat05.github.io/Fixora/)**

            ### ✨ Key Features in this Build
            - Modern elevated surface UI & emerald teal branding (`#00A896`)
            - Docked 5-tab Bottom Navigation Bar (Home, Jobs, Wallet, Messages, Profile)
            - Live Dispatch Radar with real-time countdown timer & sound/visual alerts
            - Instant UPI Payout modal bottom sheet linked to verified UPI ID (`prakhyat@oksbi`)
            - Dynamic Hourly Rate Steppers (+/- ₹50) & Operating Schedule Banner
            - Complete 5-Step KYC Verification Flow & Dual-OTP Handshake
            - Zero Linter Warnings & 100% Test Pass Rate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

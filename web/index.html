<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RapsApp Live Interactive Mobile Preview — Hyperlocal On-Demand Service & Handyman Marketplace">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RapsApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RapsApp — Live Mobile Demo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0F172A;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(0, 168, 150, 0.2);
      border-top-color: #00A896;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 18px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #F8FAFC;
    }
    .loading-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #94A3B8;
    }
  </style>

  <script>
    const serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">RapsApp Mobile UI</div>
    <div class="loading-subtitle">Initializing live mobile preview...</div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            setTimeout(function() {
              const loader = document.getElementById('loading-container');
              if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 400);
              }
            }, 500);
          });
        }
      });
    });
  </script>
</body>
</html>
